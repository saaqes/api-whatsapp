# Base de datos PostgreSQL local para desarrollo (opcional: también puedes usar Neon).
#   docker compose up -d            → solo la base de datos
#   docker compose --profile app up → base de datos + aplicación completa en http://localhost:3000
services:
  db:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_USER: whatsapp
      POSTGRES_PASSWORD: whatsapp
      POSTGRES_DB: whatsapp_ai
    ports:
      - "5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U whatsapp -d whatsapp_ai"]
      interval: 5s
      retries: 10

  app:
    profiles: ["app"]
    build: .
    depends_on:
      db:
        condition: service_healthy
    env_file: .env
    environment:
      DATABASE_URL: postgresql://whatsapp:whatsapp@db:5432/whatsapp_ai
      NODE_ENV: production
    ports:
      - "3000:3000"

volumes:
  pgdata:
